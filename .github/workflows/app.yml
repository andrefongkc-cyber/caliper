# Full test suite on macOS with the Qt shell installed.
# Runs on main and on PRs that can affect the shell, because macOS runner
# minutes cost far more than Linux. With PySide6 present, the import-boundary
# test becomes a real check that the engine never loads Qt.
name: app

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "caliper/app/**"
      - "caliper/contracts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: app (macOS)
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install engine + Qt shell + test tools
        run: uv sync --locked --extra app --group app-test
      - name: Tests
        run: uv run pytest
