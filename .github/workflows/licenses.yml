# License risk only changes when dependencies change, so install every extra
# (Qt, OCCT) and check licenses whenever the lockfile moves (ADR 0006).
name: licenses

on:
  push:
    branches: [main]
    paths: ["uv.lock", "pyproject.toml", ".github/workflows/licenses.yml"]
  pull_request:
    paths: ["uv.lock", "pyproject.toml", ".github/workflows/licenses.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: licenses (all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install everything
        run: uv sync --locked --all-extras --all-groups
      - name: Check licenses
        # pytest-qt loads Qt graphics libraries at startup, which Linux runners lack.
        run: uv run pytest -p no:pytest-qt tests/test_licenses.py
